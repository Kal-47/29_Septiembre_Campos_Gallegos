<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cristian Kalid Campos Gallegos</title>
	<style>
		body {
			background-color: #000000;
			color: #ffffff;
			font-family: DINEngschrift, sans-serif;
			margin: 0;
			padding: 40px 20px;
			text-align: center;
		}

		h1 {
			margin-bottom: 30px;
		}

		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 15px;
		}

		/* Estilos para los botones que reemplazan las etiquetas <a> */
		.btn-red {
			display: inline-block;
			width: 100%;
			max-width: 400px;
			padding: 12px 24px;
			background-color: #e60000;
			color: #ffffff;
			text-decoration: none;
			font-family: Helvetica;
			font-weight: solid;
			border-radius: 6px;
			border: 2px solid #ff5252;
			box-sizing: border-box;
			transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
		}

		/* Efecto al pasar el cursor (hover) */
		.btn-red:hover {
			background-color: #b71c1c;
			box-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
			transform: translateY(-2px);
		}

		/* Efecto al hacer clic */
		.btn-red:active {
			transform: translateY(0);
		}
	</style>
</head>
<body>

	<h1>Cristian Kalid Campos Gallegos</h1>

	<div class="container">
		<a class="btn-red" href="29_Septiembre_Campos_Gallegos/Idea.html">
			Diagram of Principal Process of my company

		</a>

			Diagram of Money Revenue of my Company
		</a>
	</div>

</body>
</html>
